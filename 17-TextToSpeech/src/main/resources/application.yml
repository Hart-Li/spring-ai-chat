spring:
  ai:
    openai:
      # ds 提供的 API 密钥
      api-key: sk-88b27d13dc9a4e98b602544eb23ffd21
      #ds 开放平台地址
      base-url: https://api.deepseek.com
      chat:
        options:
          # 模型名称。deepseek-chat 使用的是 V3 模型，deepseek-reasoner 使用的是 R1 模型
          model: deepseek-chat
          # 多样化系数。常用值在0.1-1.0之间，值越大回答越多样化，推荐设置0.7。
          temperature: 0.7
          # 限制 Token 的用量
          # max-tokens: 500
    dashscope:
      api-key: sk-0f56eb281a0b4cf4bac813e7c452d3ca   # 百炼平台创建的 API-Key



logging:
  level:
    org.springframework: debug